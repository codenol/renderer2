meta:
  title: "Конструктор отчётов"

pages:
  - id: "report-builder"
    path: "/"
    title: "Конструктор отчётов"
    layout:
      type: "app-shell"
      id: "shell"
      props:
        sidebar:
          type: "sidebar"
          id: "sidebar"
          props:
            items:
              - id: "nav-health"
                label: "Здоровье ПАК"
                icon: "network"
                href: "/health"
                state: "default"
              - id: "nav-devices"
                label: "Устройства"
                icon: "monitor"
                href: "/devices"
                state: "default"
              - id: "nav-reports"
                label: "Отчёты"
                icon: "bar-chart-3"
                href: "/"
                state: "active"
              - id: "nav-settings"
                label: "Настройки"
                icon: "settings"
                href: "/settings"
                state: "default"
        breadcrumbs:
          type: "breadcrumbs"
          id: "bc"
          props:
            items:
              - label: "ПАК"
                href: "/pak"
              - label: "Отчёты"
                href: "/reports"
              - label: "Конструктор отчётов"
        content:
          type: "vstack"
          id: "content"
          props:
            gap: 16
          children:
            - type: "card"
              id: "toolbar"
              props:
                padding: 16
                title: "Настройки отчёта"
              children:
                - type: "vstack"
                  id: "toolbar-inner"
                  props:
                    gap: 16
                  children:
                    - type: "hstack"
                      id: "toolbar-row1"
                      props:
                        gap: 12
                        align: "center"
                      children:
                        - type: "text"
                          id: "lbl-fields"
                          props:
                            text: "Колонки:"
                            variant: "body-sm"
                        - type: "button-chip"
                          id: "chip-device-id"
                          props:
                            label: "ID устройства"
                            selected: true
                        - type: "button-chip"
                          id: "chip-type"
                          props:
                            label: "Тип"
                            selected: true
                        - type: "button-chip"
                          id: "chip-model"
                          props:
                            label: "Модель"
                            selected: true
                        - type: "button-chip"
                          id: "chip-version"
                          props:
                            label: "Версия ПО"
                            selected: true
                        - type: "button-chip"
                          id: "chip-status"
                          props:
                            label: "Статус"
                            selected: true
                        - type: "button-chip"
                          id: "chip-uptime"
                          props:
                            label: "Uptime"
                            selected: false
                        - type: "dropdown"
                          id: "dd-add-field"
                          props:
                            placeholder: "+ Добавить поле"
                            options:
                              - value: "device_id"
                                label: "ID устройства"
                              - value: "type"
                                label: "Тип"
                              - value: "model"
                                label: "Модель"
                              - value: "version"
                                label: "Версия ПО"
                              - value: "status"
                                label: "Статус"
                              - value: "uptime"
                                label: "Uptime"
                    - type: "hstack"
                      id: "toolbar-row2"
                      props:
                        gap: 12
                        align: "center"
                      children:
                        - type: "text"
                          id: "lbl-group"
                          props:
                            text: "Группировка:"
                            variant: "body-sm"
                        - type: "dropdown"
                          id: "dd-group"
                          props:
                            placeholder: "Не выбрано"
                            options:
                              - value: "type"
                                label: "Тип"
                              - value: "model"
                                label: "Модель"
                              - value: "status"
                                label: "Статус"
                        - type: "text"
                          id: "lbl-sort"
                          props:
                            text: "Сортировка:"
                            variant: "body-sm"
                        - type: "dropdown"
                          id: "dd-sort"
                          props:
                            placeholder: "Не выбрано"
                            options:
                              - value: "uptime-asc"
                                label: "Uptime ↑"
                              - value: "uptime-desc"
                                label: "Uptime ↓"
                              - value: "type-asc"
                                label: "Тип А-Я"
                              - value: "status-asc"
                                label: "Статус"
                        - type: "divider"
                          id: "divider-filters"
                        - type: "text"
                          id: "lbl-filter"
                          props:
                            text: "Фильтр:"
                            variant: "body-sm"
                        - type: "dropdown"
                          id: "dd-filter-field"
                          props:
                            placeholder: "Поле"
                            size: "sm"
                            options:
                              - value: "status"
                                label: "Статус"
                              - value: "type"
                                label: "Тип"
                              - value: "model"
                                label: "Модель"
                              - value: "version"
                                label: "Версия ПО"
                        - type: "dropdown"
                          id: "dd-filter-op"
                          props:
                            placeholder: "Оператор"
                            size: "sm"
                            options:
                              - value: "equals"
                                label: "равно"
                              - value: "contains"
                                label: "содержит"
                        - type: "input"
                          id: "filter-value"
                          props:
                            placeholder: "Значение"
                            size: "sm"
                        - type: "button"
                          id: "btn-add-filter"
                          props:
                            label: "Добавить"
                            variant: "accent"
                            size: "sm"
                    - type: "hstack"
                      id: "active-filters"
                      props:
                        gap: 8
                        align: "center"
                      children:
                        - type: "text"
                          id: "lbl-active"
                          props:
                            text: "Активные фильтры:"
                            variant: "caption"
                        - type: "button-chip"
                          id: "filter-status-error"
                          props:
                            label: "Статус = critical"
                            selected: true
                            variant: "accent"
                        - type: "button-chip"
                          id: "filter-type-router"
                          props:
                            label: "Тип = router"
                            selected: true
                            variant: "accent"

            - type: "table"
              id: "tbl-report"
              props:
                columns:
                  - key: "_rowNumber"
                    label: "#"
                    width: "50px"
                    align: "center"
                  - key: "device_id"
                    label: "ID устройства"
                    width: "140px"
                  - key: "type"
                    label: "Тип"
                    width: "120px"
                    type: "badge"
                  - key: "model"
                    label: "Модель"
                    width: "180px"
                  - key: "version"
                    label: "Версия ПО"
                    width: "140px"
                  - key: "status"
                    label: "Статус"
                    width: "140px"
                    type: "status-badge"
                  - key: "uptime"
                    label: "Uptime"
                    width: "120px"
                    align: "right"
                data:
                  - _isSectionHeader: true
                    _sectionTitle: "Тип: router (5)"
                  - device_id: "DEV-001"
                    type: "router"
                    model: "Cisco ISR 4451"
                    version: "17.3.4"
                    status: "active"
                    uptime: 8640
                  - device_id: "DEV-003"
                    type: "router"
                    model: "MikroTik CCR2004"
                    version: "7.12"
                    status: "critical"
                    uptime: 432
                  - device_id: "DEV-005"
                    type: "router"
                    model: "Cisco ISR 4451"
                    version: "17.3.4"
                    status: "active"
                    uptime: 8640
                  - device_id: "DEV-007"
                    type: "router"
                    model: "Huawei NE40E"
                    version: "8.180"
