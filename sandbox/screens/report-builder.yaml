                    uptime: 2880
                  - _isSectionHeader: true
                    _sectionTitle: "Тип: sensor (4)"
                  - device_id: "DEV-002"
                    type: "sensor"
                    model: "DHT-22 Pro"
                    version: "2.1.0"
                    status: "active"
                    uptime: 4320
                  - device_id: "DEV-004"
                    type: "sensor"
                    model: "BME680"
                    version: "1.4.3"
                    status: "critical"
                    uptime: 60
                  - device_id: "DEV-006"
                    type: "sensor"
                    model: "DHT-22 Pro"
                    version: "2.1.0"
                    status: "active"
                    uptime: 4320
                  - device_id: "DEV-008"
                    type: "sensor"
                    model: "SHT31"
                    version: "3.0.1"
                    status: "warning"
                    uptime: 1440

modals: []
