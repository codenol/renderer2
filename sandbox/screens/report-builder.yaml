meta:
  title: "Конструктор отчётов"

pages:
  - id: "report-builder"
    path: "/"
    title: "Конструктор отчётов"
    layout:
      type: "app-shell"
      id: "shell"
      props:
        sidebar:
          type: "sidebar"
          id: "sidebar"
          props:
            items:
              - id: "nav-health"
                label: "Здоровье ПАК"
                icon: "network"
                href: "/health"
                state: "default"
              - id: "nav-devices"
                label: "Устройства"
                icon: "monitor"
                href: "/devices"
                state: "default"
              - id: "nav-reports"
                label: "Отчёты"
                icon: "bar-chart-3"
                href: "/"
                state: "active"
              - id: "nav-settings"
                label: "Настройки"
                icon: "settings"
                href: "/settings"
                state: "default"
        breadcrumbs:
          type: "breadcrumbs"
          id: "bc"
          props:
            items:
              - label: "ПАК"
                href: "/pak"
              - label: "Отчёты"
                href: "/reports"
              - label: "Конструктор отчётов"
        content:
          type: "vstack"
          id: "content"
          props:
            gap: 16
          children:
            - type: "card"
              id: "toolbar"
              props:
                padding: 20
              children:
                - type: "vstack"
                  id: "toolbar-inner"
                  props:
                    gap: 16
                  children:
                    - type: "hstack"
                      id: "toolbar-row1"
                      props:
                        gap: 12
                        align: "center"
                      children:
                        - type: "text"
                          id: "lbl-fields"
                          props:
                            text: "Колонки:"
                            variant: "body-sm"
                        - type: "button-chip"
                          id: "chip-node"
                          props:
                            label: "Узел"
                            selected: true
                        - type: "button-chip"
                          id: "chip-type"
                          props:
                            label: "Тип сущности"
                            selected: true
                        - type: "button-chip"
                          id: "chip-name"
                          props:
                            label: "Название"
                            selected: true
                        - type: "button-chip"
                          id: "chip-version"
                          props:
                            label: "Версия"
                            selected: true
                        - type: "button-chip"
                          id: "chip-arch"
                          props:
                            label: "Архитектура"
                            selected: true
                        - type: "button-chip"
                          id: "chip-date"
                          props:
                            label: "Дата установки"
                            selected: false
                        - type: "button-chip"
                          id: "chip-serial"
                          props:
                            label: "Серийный номер"
                            selected: false
                        - type: "button-chip"
                          id: "chip-qty"
                          props:
                            label: "Количество"
                            selected: false
                        - type: "dropdown"
                          id: "dd-add-field"
                          props:
                            placeholder: "+ Добавить поле"
                            options:
                              - value: "install_date"
                                label: "Дата установки"
                              - value: "serial_number"
                                label: "Серийный номер"
                              - value: "quantity"
                                label: "Количество"
                    - type: "hstack"
                      id: "toolbar-row2"
                      props:
                        gap: 12
                        align: "center"
                      children:
                        - type: "text"
                          id: "lbl-group"
                          props:
                            text: "Группировка:"
                            variant: "body-sm"
                        - type: "dropdown"
                          id: "dd-group"
                          props:
                            placeholder: "Не выбрано"
                            options:
                              - value: "node_name"
                                label: "Узел"
                              - value: "entity_type"
                                label: "Тип сущности"
                              - value: "arch"
                                label: "Архитектура"
                        - type: "text"
                          id: "lbl-sort"
                          props:
                            text: "Сортировка:"
                            variant: "body-sm"
                        - type: "dropdown"
                          id: "dd-sort"
                          props:
                            placeholder: "Не выбрано"
                            options:
                              - value: "install_date-desc"
                                label: "Дата установки ↓"
                              - value: "install_date-asc"
                                label: "Дата установки ↑"
                              - value: "name-asc"
                                label: "Название А-Я"
                              - value: "name-desc"
                                label: "Название Я-А"
                              - value: "version-asc"
                                label: "Версия ↑"
                        - type: "divider"
                          id: "divider-filters"
                        - type: "text"
                          id: "lbl-filter"
                          props:
                            text: "Фильтр:"
                            variant: "body-sm"
                        - type: "dropdown"
                          id: "dd-filter-field"
                          props:
                            placeholder: "Поле"
                            options:
                              - value: "node_name"
                                label: "Узел"
                              - value: "entity_type"
                                label: "Тип сущности"
                              - value: "name"
                                label: "Название"
                              - value: "version"
                                label: "Версия"
                              - value: "arch"
                                label: "Архитектура"
                              - value: "install_date"
                                label: "Дата установки"
                              - value: "serial_number"
                                label: "Серийный номер"
                              - value: "quantity"
                                label: "Количество"
                        - type: "dropdown"
                          id: "dd-filter-op"
                          props:
                            placeholder: "Оператор"
                            options:
                              - value: "equals"
                                label: "равно"
                              - value: "contains"
                                label: "содержит"
                              - value: "not_equals"
                                label: "не равно"
                        - type: "input"
                          id: "filter-value"
                          props:
                            placeholder: "Значение"
                        - type: "button"
                          id: "btn-add-filter"
                          props:
                            label: "Добавить"
                            variant: "accent"
                            size: "sm"
                    - type: "hstack"
                      id: "active-filters"
                      props:
                        gap: 8
                        align: "center"
                      children:
                        - type: "text"
                          id: "lbl-active"
                          props:
                            text: "Активные фильтры:"
                            variant: "caption"
                        - type: "button-chip"
                          id: "filter-arch"
                          props:
                            label: "Архитектура = amd64"
                            selected: true
                            variant: "accent"
                        - type: "button-chip"
                          id: "filter-type"
                          props:
                            label: "Тип сущности = package"
                            selected: true
                            variant: "accent"

            - type: "table"
              id: "tbl-report"
              props:
                columns:
                  - key: "node_name"
                    label: "Узел"
                    width: "180px"
                  - key: "entity_type"
                    label: "Тип"
                    width: "100px"
                    type: "badge"
                  - key: "name"
                    label: "Название"
                    width: "260px"
                  - key: "version"
                    label: "Версия"
                    width: "220px"
                  - key: "arch"
                    label: "Архитектура"
                    width: "80px"
                  - key: "install_date"
                    label: "Дата установки"
                    width: "140px"
