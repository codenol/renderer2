                        - key: "sw_model"
                          label: "Модель"
                        - key: "sw_role"
                          label: "Роль"
                        - key: "sw_ip"
                          label: "IP"
                        - key: "sw_serial"
                          label: "Серийный номер"
                        - key: "sw_vendor"
