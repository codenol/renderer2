meta:
  title: "CMDB — Отчёт по компонентам ПАК"

pages:
  - id: "cmdb-report"
    path: "/"
    title: "CMDB — Компоненты ПАК"
    layout:
      type: "app-shell"
      id: "shell"
      props:
        sidebar:
          type: "sidebar"
          id: "sidebar"
          props:
            items:
              - id: "nav-health"
                label: "Здоровье ПАК"
                icon: "network"
                href: "/health"
                state: "default"
              - id: "nav-devices"
                label: "Устройства"
                icon: "monitor"
                href: "/devices"
                state: "default"
              - id: "nav-reports"
                label: "Отчёты"
                icon: "bar-chart-3"
                href: "/"
                state: "active"
              - id: "nav-settings"
                label: "Настройки"
                icon: "settings"
                href: "/settings"
                state: "default"
        breadcrumbs:
          type: "breadcrumbs"
          id: "bc"
          props:
            items:
              - label: "ПАК"
                href: "/pak"
              - label: "CMDB"
                href: "/cmdb"
              - label: "Компоненты"
        content:
          type: "vstack"
          id: "content"
          props:
            gap: 16
          children:
            - type: "report-builder2"
              id: "cmdb-rb"
              props:
                dataModel:
                  types:
                    - key: "pak"
                      label: "ПАК"
                      parentType: null
