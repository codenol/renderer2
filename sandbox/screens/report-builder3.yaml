                href: "/health"
                state: "default"
              - id: "nav-devices"
                label: "Устройства"
                icon: "monitor"
                href: "/devices"
                state: "default"
              - id: "nav-reports"
                label: "Отчёты"
                icon: "bar-chart-3"
                href: "/"
                state: "active"
              - id: "nav-settings"
                label: "Настройки"
                icon: "settings"
                href: "/settings"
                state: "default"
        breadcrumbs:
          type: "breadcrumbs"
          id: "bc"
          props:
            items:
              - label: "Отчёты"
                href: "/reports"
              - label: "Конструктор отчётов"
